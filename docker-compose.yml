# Local development. Not shipped with the plugin.
#
#   docker compose up -d                          WordPress at http://localhost:8080
#   docker compose run --rm cli sh wp-content/plugins/unlimited-schema/bin/dev-setup.sh
#                                                 installs WP, activates the plugin, adds a sample post
#   docker compose run --rm tests composer install
#   docker compose run --rm tests composer test                 unit tests
#   docker compose run --rm tests composer test:integration     WordPress integration tests

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/unlimited-schema

  cli:
    image: wordpress:cli
    profiles: [tools]
    user: "33:33"
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/unlimited-schema

  testdb:
    image: mariadb:10.11
    profiles: [test]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
    tmpfs:
      - /var/lib/mysql

  tests:
    build: ./tests
    profiles: [test]
    depends_on: [testdb]
    working_dir: /plugin
    environment:
      WP_CORE_DIR: /usr/src/wordpress/
      WP_DB_HOST: testdb
    volumes:
      - .:/plugin

volumes:
  db:
  wp:
