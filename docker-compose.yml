# Local development. Not shipped with the plugin.
#
#   docker compose up -d                          WordPress at http://localhost:8080
#   docker compose run --rm cli sh wp-content/plugins/mercury-schema/bin/dev-setup.sh
#                                                 installs WP, activates the plugin, adds a sample post
#   docker compose run --rm tests composer install
#   docker compose run --rm tests composer test                 unit tests
#   docker compose run --rm tests composer test:integration     WordPress integration tests

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports:
      # Localhost only: the dev login is admin/admin, so never expose it to the network.
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/mercury-schema

  cli:
    image: wordpress:cli
    profiles: [tools]
    user: "33:33"
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/mercury-schema

  testdb:
    image: mariadb:10.11
    profiles: [test]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
    tmpfs:
      - /var/lib/mysql

  tests:
    # Other versions: WP_IMAGE=wordpress:6.0-php8.0-apache docker compose build tests
    build:
      context: ./tests
      args:
        WP_IMAGE: ${WP_IMAGE:-wordpress:php8.2-apache}
    profiles: [test]
    depends_on: [testdb]
    working_dir: /plugin
    environment:
      WP_CORE_DIR: /usr/src/wordpress/
      WP_DB_HOST: testdb
    volumes:
      - .:/plugin

volumes:
  db:
  wp:
